<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Photo Club Registration</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header>
      <h1>Join the Travel Photo Club</h1>
    </header>
    <main>
      <section id="gallery">
        <h2>Featured Shots (Select to Learn More)</h2>
        <div class="gallery-grid">
          <div class="thumb" tabindex="0" data-city="Paris">
            <img
              alt="Paris travel photo"
              src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=800" />
          </div>
          <div class="thumb" tabindex="0" data-city="London">
            <img
              alt="St Bride's Church - London"
              src="https://images.pexels.com/photos/18505045/pexels-photo-18505045.jpeg" />
          </div>
          <div class="thumb" tabindex="0" data-city="New York">
            <img
              alt="St. Patrick's Cathedral - New York"
              src="https://images.pexels.com/photos/11832094/pexels-photo-11832094.jpeg" />
          </div>
          <div class="thumb" tabindex="0" data-city="Shanghai">
            <img
              alt="Shanghai Skyline at Night - Shanghai"
              src="https://images.pexels.com/photos/3313455/pexels-photo-3313455.jpeg" />
          </div>
        </div>
        <p id="image-caption">Click (or press Enter) to select.</p>
      </section>
      <section id="registration">
        <h2>Member Sign Up</h2>
        <form id="signup-form" novalidate>
          <div class="form-group">
            <label for="username" id="label-1">Username:</label>
            <input type="text" id="username" name="username" />
            <span class="error-msg" id="error-username"></span>
          </div>
          <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" />
            <span class="error-msg" id="error-email"></span>
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" />
            <span class="error-msg" id="error-password"></span>
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" id="terms" /> I agree to the terms
            </label>
            <span class="error-msg" id="error-terms"></span>
          </div>
          <button type="submit">Register Now</button>
        </form>
      </section>
    </main>
    <script src="scripts/script.js"></script>
  </body>
</html>
